<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Bíblia Digital QQ</title>
    <!-- Dados carregam em paralelo (defer = não bloqueiam a página) -->
    <script src="Biblia_data_JFA.js" defer></script>
    <script src="Biblia_data_KJF.js" defer></script>
    <script src="Biblia_data_NTLH.js" defer></script>
    <script src="Biblia_data_NVI.js" defer></script>
    <script src="bible-versions-FINAL-v2.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        /* ===== RESET & VARIÁVEIS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0d0d0d;
            --bg-card: #1a1a1a;
            --bg-panel: #141414;
            --accent-gold: #ffffff;
            --accent-warm: #cccccc;
            --accent-red: #555555;
            --text-primary: #f5f5f5;
            --text-secondary: #cccccc;
            --text-muted: #888888;
            --text-on-gold: #000000;
            --border: #333333;
            --font-title: Georgia, serif;
            --font-body: 'EB Garamond', Georgia, serif;
            --transition: 0.3s ease;
        }
        body.light {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-card: #f0f0f0;
            --bg-panel: #e0e0e0;
            /* A cor de destaque precisa INVERTER no tema claro: no escuro ela é
               branca, e se continuasse branca aqui sumiria no fundo claro
               (título do topo, título do capítulo, número dos versículos, etc). */
            --accent-gold: #111111;
            --accent-warm: #333333;
            --accent-red: #b0b0b0;
            --text-primary: #111111;
            --text-secondary: #444444;
            /* #777777 (herdado do tema escuro) dava só 4.11:1 sobre o fundo claro —
               abaixo do mínimo legível. Este tom passa em todos os fundos claros. */
            --text-muted: #636363;
            /* Texto que fica SOBRE a cor de destaque — agora escura, então branco */
            --text-on-gold: #ffffff;
            --border: #cccccc;
        }

        html, body {
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

        /* ===== LAYOUT ===== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
        }

        /* ===== TOPBAR ===== */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }
        #topbar h1 {
            font-family: var(--font-title);
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
        }
        #topbar-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        /* Ajuste do botão de versões dentro do topbar */
        #version-btn-container .bible-version-container {
            margin-left: 0 !important;
            margin-right: 0 !important;
        }
        #version-btn-container .bible-version-btn {
            width: auto !important;
            min-width: 38px !important;
            height: 36px !important;
            padding: 4px 12px !important;
            font-size: 12px !important;
            border-radius: 50% !important;
            background: var(--bg-card) !important;
            border: 1px solid var(--border) !important;
            color: var(--text-primary) !important;
        }
        #version-btn-container .bible-version-btn:hover {
            background: var(--bg-secondary) !important;
            border-color: var(--accent-gold) !important;
            color: var(--accent-gold) !important;
        }
        .top-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 18px;
        }
        .top-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .top-btn.active { border-color: var(--accent-gold); color: var(--accent-gold); }

        /* ===== MAIN ===== */
        #main {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        #sidebar.hidden {
            transform: translateX(-100%);
            width: 0;
            border-right: none;
        }
        /* A seção precisa ser um container flex que PODE encolher (flex:1 1 0 +
           min-height:0). Sem isso, ela cresce com o conteúdo e o .sidebar-scroll
           de dentro nunca chega a rolar — só é cortado pelo overflow do #sidebar. */
        .sidebar-section {
            padding: 8px 12px;
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-section label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .sidebar-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 12px 12px;
        }
        .book-btn, .chapter-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 10px;
            margin-bottom: 2px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .book-btn:hover, .chapter-btn:hover { background: var(--bg-card); }
        .book-btn.active {
            background: var(--accent-gold);
            color: var(--text-on-gold);
            font-weight: 600;
        }
        .chapter-btn.active {
            background: var(--accent-gold);
            color: var(--text-on-gold);
            font-weight: 600;
        }
        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .chapter-grid .chapter-btn {
            text-align: center;
            padding: 6px 2px;
            font-size: 13px;
        }
        .sidebar-actions {
            padding: 8px 12px 16px;
            flex-shrink: 0;
        }
        .sidebar-actions .action-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
        }
        .sidebar-actions .action-btn:hover { border-color: var(--accent-gold); }
        .sidebar-actions .action-btn.primary {
            background: var(--accent-gold);
            color: var(--text-on-gold);
            border-color: var(--accent-gold);
            font-weight: 600;
        }
        .sidebar-actions .action-btn.primary:hover { background: var(--accent-warm); }

        /* ===== CONTENT ===== */
        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            padding: 0 16px 16px;
        }
        #content-top {
            display: flex;
            gap: 8px;
            padding: 12px 0 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        #search-input {
            flex: 1;
            min-width: 120px;
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: border var(--transition);
        }
        #search-input:focus { border-color: var(--accent-gold); }
        #search-btn {
            padding: 8px 16px;
            background: var(--accent-gold);
            color: var(--text-on-gold);
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition);
        }
        #search-btn:hover { background: var(--accent-warm); }
        #audio-btn {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition);
        }
        #audio-btn:hover { border-color: var(--accent-gold); }
        #audio-btn.playing {
            background: var(--accent-gold);
            color: var(--text-on-gold);
            border-color: var(--accent-gold);
        }

        #bible-text {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: none;
            touch-action: pan-y;
            padding: 8px 4px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
        }
        #bible-text .chapter-title {
            font-family: var(--font-title);
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-gold);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        .verse {
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            margin-bottom: 2px;
        }
        .verse:hover { background: rgba(255,255,255,0.05); }
        .verse.selected { background: rgba(255,255,255,0.14); outline: 1px solid rgba(255,255,255,0.28); border-radius: 6px; }
        body.light .verse.selected { background: rgba(0,0,0,0.09); outline: 1px solid rgba(0,0,0,0.20); }
        .verse.tts-reading { background: rgba(255,255,255,0.08); border-left: 3px solid var(--accent-gold); transition: background 0.3s ease; }
        body.light .verse.tts-reading { background: rgba(0,0,0,0.05); }
        .verse .num {
            font-size: 12px;
            color: var(--accent-gold);
            font-weight: 600;
            margin-right: 8px;
            opacity: 0.7;
        }
        .verse .text { flex: 1; }
        .verse .marker { margin-right: 4px; font-size: 14px; }
        .verse.highlight-yellow { background: rgba(255,220,60,0.3); border-left: 3px solid #f5d040; }
        .verse.highlight-red { background: rgba(255,60,60,0.3); border-left: 3px solid #f06060; }
        .verse.highlight-green { background: rgba(60,200,120,0.3); border-left: 3px solid #4cc878; }
        .verse.highlight-blue { background: rgba(60,140,255,0.3); border-left: 3px solid #6ab0f5; }
        .verse.highlight-orange { background: rgba(255,150,40,0.3); border-left: 3px solid #f5a040; }
        .verse.highlight-pink { background: rgba(255,100,160,0.3); border-left: 3px solid #f070a8; }
        .verse.highlight-purple { background: rgba(160,60,220,0.3); border-left: 3px solid #b06cd8; }
        .verse.highlight-teal { background: rgba(40,200,190,0.3); border-left: 3px solid #40c8c0; }
        .verse.highlight-brown { background: rgba(180,120,60,0.3); border-left: 3px solid #c08040; }
        .verse.highlight-lime { background: rgba(180,220,40,0.3); border-left: 3px solid #a8d840; }

        /* ===== VERSE MENU ===== */
        #verse-menu {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: var(--bg-card);
            border: 1px solid var(--accent-gold);
            border-radius: 18px;
            padding: 22px 20px;
            display: none;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            max-width: 440px;
            width: 92%;
            min-height: 130px;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transition: all 0.25s ease;
        }
        #verse-menu.top-position { bottom: auto; top: 20px; }
        #verse-menu.open {
            display: flex;
            transform: translateX(-50%) scale(1);
        }
        .vm-btn {
            background: var(--bg-panel);
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14.5px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 0 auto;
            justify-content: center;
            min-width: 78px;
        }
        .vm-btn:hover { background: var(--border); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: fadeScale 0.25s ease;
        }
        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal h2 {
            font-family: var(--font-title);
            font-size: 20px;
            color: var(--accent-gold);
            margin-bottom: 12px;
            text-align: center;
        }
        .modal .close-btn {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }
        .modal .close-btn:hover { color: var(--accent-gold); }

        /* ===== COLOR PICKER ===== */
        .color-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 8px 0;
        }
        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.active { border-color: var(--accent-gold); }

        /* ===== PROGRESS ===== */
        .progress-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .progress-bar {
            width: 80px;
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            align-self: center;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent-gold);
            border-radius: 4px;
            transition: width 0.4s;
        }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--accent-gold);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 300;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 300px;
                transform: translateX(-100%);
                z-index: 50;
                border-right: none;
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
                background: var(--bg-secondary);
            }
            #sidebar.open { transform: translateX(0); }
            #sidebar-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 45;
                display: none;
            }
            #sidebar-backdrop.open { display: block; }
            #topbar h1 { font-size: 16px; }
            .chapter-grid { grid-template-columns: repeat(4, 1fr); }
            #verse-menu { bottom: 10px; padding: 16px 14px; min-height: 110px; }
            #verse-menu.top-position { top: 10px; }
            .vm-btn { font-size: 13px; padding: 10px 12px; min-width: 64px; }
        }
        @media (max-width: 480px) {
            #bible-text { font-size: 15px; }
            .chapter-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Topbar -->
    <header id="topbar">
        <div style="display:flex;align-items:center;gap:8px;">
            <button id="menu-toggle" class="top-btn" aria-label="Menu">☰</button>
            <h1 id="app-title">Bíblia Digital Qq</h1>
            <button id="audio-btn-top" class="top-btn" aria-label="Ouvir capítulo">🔊</button>
            <button id="theme-toggle" class="top-btn" aria-label="Tema">🌙</button>
        </div>
        <div id="version-btn-container"></div>
    </header>

    <!-- Sidebar backdrop (mobile) -->
    <div id="sidebar-backdrop"></div>

    <div id="main">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-section">
                <label>Livro</label>
                <div id="book-list" class="sidebar-scroll"></div>
            </div>
            <div class="sidebar-section">
                <label>Capítulo</label>
                <div id="chapter-list" class="sidebar-scroll"></div>
            </div>
            <div class="sidebar-actions">
                <button class="action-btn primary" id="btn-favoritos">★ Favoritos</button>
                <button class="action-btn" id="btn-historico">🕑 Histórico</button>
                <button class="action-btn" id="btn-progresso">📊 Progresso</button>
                <button class="action-btn" id="audio-btn">🔊 Ouvir Capítulo</button>
            </div>

            <!-- Zoom de fonte na sidebar -->
            <div style="padding:0 12px 12px;display:flex;align-items:center;gap:6px;">
                <span style="font-size:11px;color:var(--text-muted);margin-right:2px;">Fonte:</span>
                <button id="font-dec" style="width:34px;height:28px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:14px;font-weight:bold;">A−</button>
                <button id="font-inc" style="width:34px;height:28px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:14px;font-weight:bold;">A+</button>
            </div>
        </aside>

        <!-- Content -->
        <section id="content">
            <div id="bible-text"></div>
        </section>
    </div>
</div>

<!-- Verse Menu -->
<div id="verse-menu">
    <button class="vm-btn" data-action="highlight">🖊 Marcar</button>
    <button class="vm-btn" data-action="favorite">☆ Favoritar</button>
    <button class="vm-btn" data-action="note">📝 Anotar</button>
    <button class="vm-btn" data-action="copy">📋 Copiar</button>
    <button class="vm-btn" data-action="share">↗ Compartilhar</button>
    <button class="vm-btn" data-action="listen">🔊 Ouvir</button>
    <button class="vm-btn" data-action="google">🔎 Google IA</button>
    <button class="vm-btn" data-action="search">🔍 Pesquisar</button>
</div>

<!-- Modal genérico -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal" id="modal-content">
        <button class="close-btn" id="modal-close">✕</button>
        <h2 id="modal-title">Título</h2>
        <div id="modal-body"></div>
    </div>
</div>

<!-- Modal de busca -->
<div id="search-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-start;justify-content:center;padding-top:60px;">
    <div style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:14px;width:92%;max-width:500px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;">
        <div style="display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);">
            <input id="search-input" type="text" placeholder="Pesquisar palavra ou frase..." autocomplete="off"
                style="flex:1;padding:9px 12px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;">
            <button id="search-btn" style="padding:9px 14px;background:var(--accent-gold);color:var(--text-on-gold);border:none;border-radius:8px;font-size:13px;cursor:pointer;">Buscar</button>
            <button id="search-close" style="padding:9px 12px;background:var(--bg-card);color:var(--text-muted);border:1px solid var(--border);border-radius:8px;cursor:pointer;">✕</button>
        </div>
        <div id="search-results" style="flex:1;overflow-y:auto;padding:10px 16px;"></div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ====================================================================
// DADOS DA BÍBLIA (carregados do Biblia_data.js ou fallback)
// ====================================================================
let bibleData = [];

// Função para carregar dados do arquivo JS (via fetch)
async function loadBibleData() {
    // Tenta pegar dados já carregados (script defer roda antes deste inline)
    if (typeof bibleDataExterno !== 'undefined' && Array.isArray(bibleDataExterno)) {
        bibleData = bibleDataExterno; return true;
    }
    // Procura as versões nomeadas (carregadas em paralelo pelo head)
    for (const v of ['JFA','KJF','NTLH','NVI']) {
        const d = window['bibleData_' + v];
        if (d && Array.isArray(d) && d.length > 0) {
            bibleData = d; window.bibleDataExterno = d; return true;
        }
    }
    // Espera breve caso ainda não tenha terminado de carregar
    for (let i = 0; i < 20; i++) {
        await new Promise(r => setTimeout(r, 50));
        if (typeof bibleDataExterno !== 'undefined' && Array.isArray(bibleDataExterno)) {
            bibleData = bibleDataExterno; return true;
        }
        for (const v of ['JFA','KJF','NTLH','NVI']) {
            const d = window['bibleData_' + v];
            if (d && Array.isArray(d) && d.length > 0) {
                bibleData = d; window.bibleDataExterno = d; return true;
            }
        }
    }
    // Fallback: dados de emergência
    bibleData = [
        { name: "Gênesis", chapters: [["No princípio, criou Deus os céus e a terra.", "E a terra era sem forma e vazia."]] },
        { name: "João", chapters: [["Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito."]] }
    ];
    return false;
}

// ====================================================================
// ESTADO DO APP
// ====================================================================
let state = {
    bookIndex: 0,
    chapterIndex: 0,
    selectedVerses: [],      // índices dos versículos selecionados
    lastSelectedVerse: null,
    highlights: {},          // chave: "livro|cap|vers" -> cor
    favorites: {},           // chave -> true
    notes: {},               // chave -> texto
    history: [],             // [{livro, capitulo, data}]
    chaptersRead: new Set(), // "livro|cap"
    lastPosition: null,      // {livro, capitulo, versiculo}
    theme: 'dark',
    fontSize: 16,
    audioPlaying: false,
    ttsUtterance: null,
};

// ====================================================================
// PERSISTÊNCIA (localStorage)
// ====================================================================
function saveState() {
    const toSave = {
        highlights: state.highlights,
        favorites: state.favorites,
        notes: state.notes,
        history: state.history,
        chaptersRead: Array.from(state.chaptersRead),
        lastPosition: state.lastPosition,
        bookIndex: state.bookIndex,
        chapterIndex: state.chapterIndex,
        theme: state.theme,
        fontSize: state.fontSize,
    };
    try {
        localStorage.setItem('biblia_state', JSON.stringify(toSave));
    } catch (e) {}
}

function loadState() {
    try {
        const raw = localStorage.getItem('biblia_state');
        if (raw) {
            const saved = JSON.parse(raw);
            state.highlights = saved.highlights || {};
            state.favorites = saved.favorites || {};
            state.notes = saved.notes || {};
            state.history = saved.history || [];
            state.chaptersRead = new Set(saved.chaptersRead || []);
            state.lastPosition = saved.lastPosition || null;
            if (saved.bookIndex !== undefined) state.bookIndex = saved.bookIndex;
            if (saved.chapterIndex !== undefined) state.chapterIndex = saved.chapterIndex;
            state.theme = saved.theme || 'dark';
            state.fontSize = saved.fontSize || 16;
        }
    } catch (e) {}
}

// Aplica tema
function applyTheme() {
    document.body.classList.toggle('light', state.theme === 'light');
    document.getElementById('theme-toggle').textContent = state.theme === 'light' ? '☀️' : '🌙';
    document.querySelector('meta[name="theme-color"]').content = state.theme === 'light' ? '#ffffff' : '#000000';
}

// ====================================================================
// NAVEGAÇÃO
// ====================================================================
function getBookNames() {
    return bibleData.map(b => b.name);
}

function getChapters(bookIndex) {
    if (!bibleData[bookIndex]) return [];
    return bibleData[bookIndex].chapters.map((_, i) => i);
}

function getChapterVerses(bookIndex, chapterIndex) {
    const book = bibleData[bookIndex];
    if (!book || !book.chapters[chapterIndex]) return [];
    return book.chapters[chapterIndex];
}

// Renderiza lista de livros na sidebar
function renderBookList() {
    const container = document.getElementById('book-list');
    container.innerHTML = '';
    const names = getBookNames();
    names.forEach((name, i) => {
        const btn = document.createElement('button');
        btn.className = 'book-btn' + (i === state.bookIndex ? ' active' : '');
        btn.textContent = name;
        btn.dataset.index = i;
        btn.addEventListener('click', () => {
            state.bookIndex = i;
            state.chapterIndex = 0;
            state.selectedVerses = [];
            state.lastSelectedVerse = null;
            // Salva a posição ao trocar de livro
            state.lastPosition = { livro: i, capitulo: 0, versiculo: 0 };
            renderBookList();
            renderChapterList();
            renderChapter();
            saveState();
            // NÃO fecha a sidebar aqui — usuário ainda precisa escolher o capítulo
        });
        container.appendChild(btn);
    });
}

// Renderiza lista de capítulos na sidebar
function renderChapterList() {
    const container = document.getElementById('chapter-list');
    container.innerHTML = '';
    const chapters = getChapters(state.bookIndex);
    if (chapters.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Nenhum capítulo</div>';
        return;
    }
    const grid = document.createElement('div');
    grid.className = 'chapter-grid';
    chapters.forEach((ci) => {
        const btn = document.createElement('button');
        btn.className = 'chapter-btn' + (ci === state.chapterIndex ? ' active' : '');
        btn.textContent = ci + 1;
        // Marcar se lido
        if (state.chaptersRead.has(`${state.bookIndex}|${ci}`)) {
            btn.style.background = 'rgba(255,255,255,0.1)';
            btn.style.border = '1px solid var(--accent-gold)';
        }
        btn.dataset.index = ci;
        btn.addEventListener('click', () => {
            state.chapterIndex = ci;
            state.selectedVerses = [];
            state.lastSelectedVerse = null;
            // Salva a posição imediatamente ao trocar de capítulo
            state.lastPosition = { livro: state.bookIndex, capitulo: ci, versiculo: 0 };
            renderBookList();
            renderChapterList();
            renderChapter();
            saveState();
            if (window.innerWidth <= 768) closeSidebar();
        });
        grid.appendChild(btn);
    });
    container.appendChild(grid);
}

// ====================================================================
// RENDERIZAÇÃO DO CAPÍTULO
// ====================================================================
function renderChapter(preservarScroll) {
    const container = document.getElementById('bible-text');
    const scrollAntes = preservarScroll ? container.scrollTop : 0;
    const book = bibleData[state.bookIndex];
    if (!book) {
        container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">Nenhum dado carregado.</div>';
        return;
    }
    const verses = getChapterVerses(state.bookIndex, state.chapterIndex);
    if (!verses || verses.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">Capítulo vazio.</div>';
        return;
    }

    // Título
    let html = `<div class="chapter-title">${book.name.toUpperCase()} — CAPÍTULO ${state.chapterIndex + 1}</div>`;

    verses.forEach((text, i) => {
        const key = `${state.bookIndex}|${state.chapterIndex}|${i}`;
        const highlight = state.highlights[key] || '';
        const isFav = !!state.favorites[key];
        const hasNote = !!state.notes[key];
        const isSelected = state.selectedVerses.includes(i);

        let marker = '';
        if (isFav) marker += '★ ';
        if (hasNote) marker += '📝 ';

        html += `<div class="verse ${highlight ? 'highlight-' + highlight : ''} ${isSelected ? 'selected' : ''}" data-verse="${i}" data-key="${key}">
            <span class="marker">${marker}</span>
            <span class="num">${i + 1}.</span>
            <span class="text">${text}</span>
        </div>`;
    });

    container.innerHTML = html;

    // Eventos de clique nos versículos
    container.querySelectorAll('.verse').forEach(el => {
        el.addEventListener('click', (e) => {
            const idx = parseInt(el.dataset.verse);
            selectVerse(idx);
        });
        // Menu de contexto (clique direito)
        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const idx = parseInt(el.dataset.verse);
            selectVerse(idx);
            showVerseMenu();
        });
    });

    // Marcar capítulo como lido se estiver no final (scroll)
    // (já será feito pelo monitor de scroll)

    // Restaurar posição de leitura (só quando NÃO é redesenho por marcação)
    if (!preservarScroll && state.lastPosition && state.lastPosition.livro === state.bookIndex && state.lastPosition.capitulo === state.chapterIndex) {
        const vers = state.lastPosition.versiculo;
        if (vers !== undefined) {
            const target = container.querySelector(`.verse[data-verse="${vers}"]`);
            if (target) {
                setTimeout(() => { if (target.scrollIntoView) target.scrollIntoView({ block: 'center' }); }, 100);
            }
        }
    }

    // Adicionar ao histórico
    addHistory(state.bookIndex, state.chapterIndex);
    saveState();

    // Restaura scroll quando chamado por ação de marcação (highlight, fav, note)
    if (preservarScroll && scrollAntes > 0) {
        container.scrollTop = scrollAntes;
    }
}

// ====================================================================
// SELEÇÃO DE VERSÍCULOS
// ====================================================================
function selectVerse(idx) {
    const el = document.querySelector(`.verse[data-verse="${idx}"]`);
    if (!el) return;

    if (state.selectedVerses.includes(idx)) {
        // Desmarcar
        state.selectedVerses = state.selectedVerses.filter(v => v !== idx);
        el.classList.remove('selected');
        if (state.lastSelectedVerse === idx) state.lastSelectedVerse = null;
    } else {
        state.selectedVerses.push(idx);
        state.lastSelectedVerse = idx;
        el.classList.add('selected');
    }

    // Esconder menu se não houver seleção
    if (state.selectedVerses.length === 0) {
        hideVerseMenu();
    } else {
        showVerseMenu();
    }
}

// ====================================================================
// MENU DO VERSÍCULO
// ====================================================================
function showVerseMenu() {
    const menu = document.getElementById('verse-menu');
    const verses = getChapterVerses(state.bookIndex, state.chapterIndex);
    const idx = state.lastSelectedVerse;
    const totalVerses = verses ? verses.length : 0;
    const ehUltimos3 = totalVerses > 0 && idx !== null && idx >= totalVerses - 3;
    menu.classList.toggle('top-position', ehUltimos3);
    menu.classList.add('open');
}

function hideVerseMenu() {
    document.getElementById('verse-menu').classList.remove('open');
}

// Ações do menu
document.querySelectorAll('#verse-menu .vm-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if (state.selectedVerses.length === 0) {
            toast('Selecione um versículo primeiro.');
            return;
        }
        const firstIdx = state.selectedVerses[0];
        const key = `${state.bookIndex}|${state.chapterIndex}|${firstIdx}`;
        const book = bibleData[state.bookIndex];
        const verseText = book.chapters[state.chapterIndex][firstIdx];
        const ref = `${book.name} ${state.chapterIndex+1}:${firstIdx+1}`;

        switch (action) {
            case 'highlight':
                openHighlightPicker(key);
                break;
            case 'favorite':
                toggleFavorite(key);
                break;
            case 'note':
                openNoteEditor(key);
                break;
            case 'copy':
                copyVerse();
                break;
            case 'share':
                shareVerse();
                break;
            case 'listen':
                listenVerse(firstIdx);
                break;

    });
});

// ====================================================================
// FUNÇÕES DO MENU
// ====================================================================
function openHighlightPicker(key) {
    // Captura todos os selecionados ANTES de qualquer limpeza
    const allKeys = state.selectedVerses.map(vi => `${state.bookIndex}|${state.chapterIndex}|${vi}`);
    if (allKeys.length === 0) allKeys.push(key); // fallback: pelo menos o que foi passado

    const body = document.getElementById('modal-body');
    const colors = [
        ['yellow', '#f5d040'], ['red', '#f06060'], ['green', '#4cc878'],
        ['blue', '#6ab0f5'], ['orange', '#f5a040'], ['pink', '#f070a8'],
        ['purple', '#b06cd8'], ['teal', '#40c8c0'], ['brown', '#c08040'],
        ['lime', '#a8d840']
    ];
    let html = '<div class="color-grid">';
    html += `<div class="color-swatch" style="background:var(--bg-card);border:2px dashed var(--border);" data-color="none" title="Remover">✕</div>`;
    colors.forEach(([name, hex]) => {
        const active = state.highlights[key] === name ? ' active' : '';
        html += `<div class="color-swatch${active}" style="background:${hex};" data-color="${name}" title="${name}"></div>`;
    });
    html += '</div>';
    const countLabel = allKeys.length > 1 ? `<div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px;">${allKeys.length} versículos selecionados</div>` : '';
    body.innerHTML = html + countLabel;
    openModal('Destacar Versículo');

    body.querySelectorAll('.color-swatch').forEach(el => {
        el.addEventListener('click', () => {
            const color = el.dataset.color;
            allKeys.forEach(k => {
                if (color === 'none') { delete state.highlights[k]; }
                else { state.highlights[k] = color; }
            });
            state.selectedVerses = [];
            state.lastSelectedVerse = null;
            saveState();
            renderChapter(true);
            closeModal();
            const msg = color === 'none'
                ? (allKeys.length > 1 ? allKeys.length + ' destaques removidos' : 'Destaque removido')
                : (allKeys.length > 1 ? allKeys.length + ' versículos destacados!' : 'Versículo destacado!');
            toast(msg);
        });
    });
}

function toggleFavorite(key) {
    const allKeys = state.selectedVerses.map(vi => `${state.bookIndex}|${state.chapterIndex}|${vi}`);
    if (allKeys.length === 0) allKeys.push(key);

    // Se o primeiro já é favorito, remove todos; senão, adiciona todos
    const removing = !!state.favorites[allKeys[0]];
    allKeys.forEach(k => {
        if (removing) delete state.favorites[k];
        else state.favorites[k] = true;
    });
    state.selectedVerses = [];
    state.lastSelectedVerse = null;
    saveState();
    renderChapter(true);
    const msg = removing
        ? (allKeys.length > 1 ? allKeys.length + ' removidos dos favoritos' : 'Removido dos favoritos')
        : (allKeys.length > 1 ? '★ ' + allKeys.length + ' adicionados aos favoritos!' : '★ Adicionado aos favoritos!');
    toast(msg);
}

function openNoteEditor(key) {
    const body = document.getElementById('modal-body');
    const current = state.notes[key] || '';
    const parts = key.split('|');
    const book = bibleData[parseInt(parts[0])];
    const ref = book ? book.name + ' ' + (parseInt(parts[1])+1) + ':' + (parseInt(parts[2])+1) : '';
    body.innerHTML = `
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">${ref}</div>
        <textarea id="note-text" placeholder="Escreva sua anotação aqui..."
            style="width:100%;height:55vh;min-height:280px;background:var(--bg-card);color:var(--text-primary);
            border:1px solid var(--border);border-radius:10px;padding:16px 14px;
            font-family:'Georgia',serif;font-size:16px;line-height:1.7;resize:none;
            box-shadow:inset 0 2px 8px rgba(0,0,0,0.15);">${current}</textarea>
        <div style="display:flex;gap:8px;margin-top:14px;">
            <button id="note-save" class="action-btn primary" style="flex:1;padding:12px;">Salvar</button>
            <button id="note-delete" class="action-btn" style="flex:1;padding:12px;background:var(--accent-red);">Excluir</button>
        </div>
    `;
    openModal('📝 Anotação');

    // Foca no campo de texto automaticamente
    setTimeout(() => document.getElementById('note-text').focus(), 100);

    document.getElementById('note-save').addEventListener('click', () => {
        const text = document.getElementById('note-text').value.trim();
        if (text) state.notes[key] = text;
        else delete state.notes[key];
        state.selectedVerses = []; state.lastSelectedVerse = null;
        saveState();
        renderChapter(true);
        closeModal();
        toast(text ? 'Anotação salva!' : 'Anotação removida');
    });
    document.getElementById('note-delete').addEventListener('click', () => {
        delete state.notes[key];
        state.selectedVerses = []; state.lastSelectedVerse = null;
        saveState();
        renderChapter(true);
        closeModal();
        toast('Anotação removida');
    });
}

function _getSelectedText() {
    if (state.selectedVerses.length === 0) return null;
    const book = bibleData[state.bookIndex];
    const sorted = state.selectedVerses.slice().sort((a,b) => a - b);
    const lines = sorted.map(i => book.chapters[state.chapterIndex][i]);
    const first = sorted[0] + 1;
    const last = sorted[sorted.length - 1] + 1;
    const ref = first === last
        ? book.name + ' ' + (state.chapterIndex+1) + '.' + first
        : book.name + ' ' + (state.chapterIndex+1) + '.' + first + '-' + last;
    var text = lines.join('\n');
    return { text: text, ref: ref, count: sorted.length };
}

function _clearSelection() {
    document.querySelectorAll('.verse.selected').forEach(v => v.classList.remove('selected'));
    state.selectedVerses = [];
    state.lastSelectedVerse = null;
    hideVerseMenu();
}

function copyVerse() {
    const sel = _getSelectedText();
    if (!sel) { toast('Selecione um versículo'); return; }
    const full = sel.text + '\n' + sel.ref;
    const msg = sel.count === 1 ? '📋 Versículo copiado!' : '📋 ' + sel.count + ' versículos copiados!';
    navigator.clipboard.writeText(full).then(() => { toast(msg); _clearSelection(); }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = full; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        toast(msg); _clearSelection();
    });
}

function shareVerse() {
    const sel = _getSelectedText();
    if (!sel) { toast('Selecione um versículo'); return; }
    const full = sel.text + '\n' + sel.ref;
    if (navigator.share) {
        navigator.share({ text: full }).catch(() => {});
    } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(full), '_blank');
    }
    _clearSelection();
}

function listenVerse(idx) {
    const book = bibleData[state.bookIndex];
    const text = book.chapters[state.chapterIndex][idx];
    if (!window.speechSynthesis) {
        toast('TTS não disponível neste navegador.');
        return;
    }
    // Para qualquer fala anterior
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'pt-BR';
    utterance.rate = 0.9;
    utterance.pitch = 1;
    window.speechSynthesis.speak(utterance);
    toast('🔊 Ouvindo versículo...');
}

function googleAI(idx) {
    const book = bibleData[state.bookIndex];
    const text = book.chapters[state.chapterIndex][idx];
    const ref = `${book.name} ${state.chapterIndex+1}:${idx+1}`;
    const query = encodeURIComponent(`${ref} ${text}`);
    window.open(`https://www.google.com/search?q=${query}&udm=50`, '_blank');
}

// ====================================================================
// ÁUDIO DO CAPÍTULO (TTS) — Leitura contínua + segundo plano
// ====================================================================
let _ttsQueue = [], _ttsIdx = 0, _ttsRunning = false, _ttsContinuous = true;
let _ttsUtterance = null, _wakeLock = null;
let _ttsKeepaliveInterval = null, _ttsAudioCtx = null, _ttsAudioNode = null;

function _hasWebSpeech() { return typeof window.speechSynthesis !== 'undefined'; }

function _hasAndroidBridge() {
    return typeof window.Android !== 'undefined' &&
           typeof window.Android.startTTS === 'function';
}

function _getBestVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang && v.lang.startsWith('pt')) || null;
}

function _buildQueue() {
    const book = bibleData[state.bookIndex];
    if (!book) return [];
    const chapter = book.chapters[state.chapterIndex];
    if (!chapter) return [];
    return chapter.map((txt, i) => ({ text: (i+1) + '. ' + txt, vi: i }));
}

function _setAudioUI(playing, msg) {
    const btn = document.getElementById('audio-btn');
    const btnTop = document.getElementById('audio-btn-top');
    if (btn) { btn.textContent = playing ? '⏹ Parar' : '🔊 Ouvir Capítulo'; btn.classList.toggle('playing', playing); }
    if (btnTop) btnTop.classList.toggle('playing', playing);
    if (msg) toast(msg);
    _setupMediaSession(playing);
}

function _setupMediaSession(playing) {
    if (!('mediaSession' in navigator)) return;
    const book = bibleData && bibleData[state.bookIndex];
    const title = book ? book.name + ' ' + (state.chapterIndex + 1) : 'Bíblia Digital QQ';
    try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: 'Bíblia Digital QQ' });
        navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
        navigator.mediaSession.setActionHandler('play', () => { try { window.speechSynthesis.resume(); } catch(e){} });
        navigator.mediaSession.setActionHandler('pause', () => { try { window.speechSynthesis.pause(); } catch(e){} });
        navigator.mediaSession.setActionHandler('stop', stopChapterAudio);
        navigator.mediaSession.setActionHandler('nexttrack', () => _ttsAdvanceChapter(1));
        navigator.mediaSession.setActionHandler('previoustrack', () => _ttsAdvanceChapter(-1));
    } catch(e) {}
}

// ── WAKE LOCK (impede tela de apagar) ────────────────
async function _requestWakeLock() {
    try { if ('wakeLock' in navigator) _wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function _releaseWakeLock() {
    try { if (_wakeLock) { _wakeLock.release(); _wakeLock = null; } } catch(e) {}
}

// ── KEEPALIVE: resume a cada 500ms (WebView pausa sozinho) ──
function _startTtsKeepalive() {
    _stopTtsKeepalive();
    _ttsKeepaliveInterval = setInterval(() => {
        if (!_ttsRunning) { _stopTtsKeepalive(); return; }
        try { if (window.speechSynthesis.paused) window.speechSynthesis.resume(); } catch(e) {}
    }, 500);
}
function _stopTtsKeepalive() {
    if (_ttsKeepaliveInterval) { clearInterval(_ttsKeepaliveInterval); _ttsKeepaliveInterval = null; }
}

// ── KEEPALIVE ÁUDIO: AudioContext silencioso mantém sessão ativa ──
function _startAudioKeepalive() {
    if (_ttsAudioCtx) return;
    try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        _ttsAudioCtx = new AC();
        var osc = _ttsAudioCtx.createOscillator();
        var gain = _ttsAudioCtx.createGain();
        gain.gain.value = 0.001;
        osc.connect(gain); gain.connect(_ttsAudioCtx.destination); osc.start();
        _ttsAudioNode = osc;
    } catch(e) {}
}
function _stopAudioKeepalive() {
    try { if (_ttsAudioNode) { _ttsAudioNode.stop(); _ttsAudioNode = null; } } catch(e) {}
    try { if (_ttsAudioCtx) { _ttsAudioCtx.close(); _ttsAudioCtx = null; } } catch(e) {}
}

// ── BRIDGE ANDROID NATIVO: verso por verso via Java TTS ──────
function _androidSpeakNext() {
    if (!_ttsRunning || _ttsIdx >= _ttsQueue.length) {
        if (_ttsRunning) _ttsFinished();
        return;
    }
    const item = _ttsQueue[_ttsIdx];
    // Destaca o verso atual
    document.querySelectorAll('.verse.tts-reading').forEach(el => el.classList.remove('tts-reading'));
    const verseEl = document.querySelector(`.verse[data-verse="${item.vi}"]`);
    if (verseEl) {
        verseEl.classList.add('tts-reading');
        if (verseEl.scrollIntoView) verseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    try {
        window.Android.startTTS(String(item.text), 'pt-BR', 0.95, 1.0);
    } catch(e) {
        // Bridge falhou — fallback pra Web Speech
        _ttsSpeakNext();
    }
}

// APK chama este callback quando cada verso termina
window.onTTSVerseFinished = () => {
    if (!_ttsRunning) return;
    _ttsIdx++;
    setTimeout(_androidSpeakNext, 150);
};

// APK chama quando o capítulo inteiro termina (batch mode)
window.onTTSChapterDone = () => {
    if (_ttsRunning) _ttsFinished();
};

// ── WEB SPEECH: verso por verso (navegador) ──────────────────
function _ttsSpeakNext() {
    if (!_ttsRunning || _ttsIdx >= _ttsQueue.length) {
        if (_ttsRunning) _ttsFinished();
        return;
    }
    const item = _ttsQueue[_ttsIdx];
    const utt = new SpeechSynthesisUtterance(item.text);
    const voice = _getBestVoice();
    if (voice) { utt.voice = voice; utt.lang = voice.lang; } else { utt.lang = 'pt-BR'; }
    utt.rate = 0.95; utt.pitch = 1; utt.volume = 1;

    utt.onstart = () => {
        document.querySelectorAll('.verse.tts-reading').forEach(el => el.classList.remove('tts-reading'));
        const verseEl = document.querySelector(`.verse[data-verse="${item.vi}"]`);
        if (verseEl) {
            verseEl.classList.add('tts-reading');
            if (verseEl.scrollIntoView) verseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    };
    utt.onend = () => {
        if (!_ttsRunning) return;
        _ttsIdx++;
        setTimeout(_ttsSpeakNext, 120);
    };
    utt.onerror = (ev) => {
        var err = (ev && ev.error) || '';
        if (err === 'interrupted' || err === 'canceled') return;
        if (!_ttsRunning) return;
        _ttsIdx++;
        setTimeout(_ttsSpeakNext, 200);
    };
    _ttsUtterance = utt;
    try { window.speechSynthesis.speak(utt); } catch(e) { _ttsFinished(); return; }
    setTimeout(() => {
        if (!_ttsRunning) return;
        try { if (window.speechSynthesis.paused) window.speechSynthesis.resume(); } catch(e) {}
    }, 300);
}

// ── LEITURA CONTÍNUA: avança capítulo quando termina ──
function _ttsFinished() {
    if (_ttsRunning && _ttsContinuous) {
        const book = bibleData[state.bookIndex];
        state.chaptersRead.add(`${state.bookIndex}|${state.chapterIndex}`);

        if (state.chapterIndex < book.chapters.length - 1) {
            state.chapterIndex++;
        } else if (state.bookIndex < bibleData.length - 1) {
            state.bookIndex++;
            state.chapterIndex = 0;
        } else {
            _ttsRunning = false;
            _cleanup();
            _setAudioUI(false, '🎉 Bíblia completa lida!');
            return;
        }

        state.lastPosition = { livro: state.bookIndex, capitulo: state.chapterIndex, versiculo: 0 };
        saveState();
        renderBookList(); renderChapterList(); renderChapter();
        setTimeout(() => {
            if (!_ttsRunning) return;
            _ttsQueue = _buildQueue(); _ttsIdx = 0;
            _ttsSpeakNext();
            const bookName = bibleData[state.bookIndex].name;
            toast('📖 ' + bookName + ' ' + (state.chapterIndex + 1));
        }, 800);
        return;
    }
    _ttsRunning = false;
    _cleanup();
    document.querySelectorAll('.verse.tts-reading').forEach(el => el.classList.remove('tts-reading'));
    _setAudioUI(false, '✓ Leitura concluída');
    state.chaptersRead.add(`${state.bookIndex}|${state.chapterIndex}`);
    saveState(); renderChapterList();
}

function _ttsAdvanceChapter(dir) {
    const wasRunning = _ttsRunning;
    stopChapterAudio();
    if (dir > 0 && state.chapterIndex < bibleData[state.bookIndex].chapters.length - 1) {
        state.chapterIndex++;
    } else if (dir > 0 && state.bookIndex < bibleData.length - 1) {
        state.bookIndex++; state.chapterIndex = 0;
    } else if (dir < 0 && state.chapterIndex > 0) {
        state.chapterIndex--;
    } else if (dir < 0 && state.bookIndex > 0) {
        state.bookIndex--; state.chapterIndex = bibleData[state.bookIndex].chapters.length - 1;
    }
    renderBookList(); renderChapterList(); renderChapter(); saveState();
    if (wasRunning) setTimeout(playChapterAudio, 300);
}

function _cleanup() {
    _stopTtsKeepalive(); _stopAudioKeepalive(); _releaseWakeLock();
    try { window.speechSynthesis.cancel(); } catch(e) {}
    _ttsUtterance = null;
}

// ── INICIAR / PARAR ──────────────────────────────────
async function playChapterAudio() {
    if (state.audioPlaying || _ttsRunning) { stopChapterAudio(); return; }

    const book = bibleData[state.bookIndex];
    if (!book) return;
    const verses = book.chapters[state.chapterIndex];
    if (!verses || !verses.length) return;

    // Detecta qual engine usar
    const useNative = _hasAndroidBridge();
    const useWeb = !useNative && (typeof window.speechSynthesis !== 'undefined');

    if (!useNative && !useWeb) {
        toast('Instale o Google TTS na Play Store ou use no navegador Chrome.');
        return;
    }

    try { if (useWeb) window.speechSynthesis.cancel(); } catch(e) {}
    _ttsQueue = _buildQueue(); _ttsIdx = 0;
    _ttsRunning = true; state.audioPlaying = true;

    await _requestWakeLock();
    if (useWeb) { _startAudioKeepalive(); _startTtsKeepalive(); }
    _setAudioUI(true, '🔊 ' + book.name + ' ' + (state.chapterIndex + 1) + ' — ' + verses.length + ' versículos');

    // No APK: usa bridge nativo + foreground service
    if (useNative) {
        try {
            if (window.Android.acquireWakeLock) window.Android.acquireWakeLock();
            if (window.Android.startReadingForeground)
                window.Android.startReadingForeground(book.name + ' ' + (state.chapterIndex + 1), 'Bíblia Digital QQ');
        } catch(e) {}
    }

    setTimeout(() => {
        if (!_ttsRunning) return;
        if (useNative) _androidSpeakNext();
        else _ttsSpeakNext();
    }, 200);
}

function stopChapterAudio() {
    _ttsRunning = false; state.audioPlaying = false;
    _ttsIdx = _ttsQueue.length;
    _cleanup();
    // Para o TTS nativo do Android
    if (_hasAndroidBridge()) {
        try { if (window.Android.stopTTS) window.Android.stopTTS(); } catch(e) {}
        try { if (window.Android.releaseWakeLock) window.Android.releaseWakeLock(); } catch(e) {}
        try { if (window.Android.stopReadingForeground) window.Android.stopReadingForeground(); } catch(e) {}
    }
    document.querySelectorAll('.verse.tts-reading').forEach(el => el.classList.remove('tts-reading'));
    _setAudioUI(false);
}

// ── SEGUNDO PLANO: retomar ao voltar / manter vivo ───
document.addEventListener('visibilitychange', async () => {
    if (!_ttsRunning) return;
    if (!document.hidden) {
        if (_wakeLock !== null) await _requestWakeLock();
        setTimeout(() => {
            try {
                if (window.speechSynthesis.paused) window.speechSynthesis.resume();
                if (!window.speechSynthesis.speaking && _ttsIdx < _ttsQueue.length) _ttsSpeakNext();
            } catch(e) {}
        }, 300);
    } else {
        try { if (window.speechSynthesis.paused) window.speechSynthesis.resume(); } catch(e) {}
    }
});

// Keepalive global de segurança
setInterval(() => {
    if (!_ttsRunning) return;
    try { if (_hasWebSpeech() && window.speechSynthesis.paused) window.speechSynthesis.resume(); } catch(e) {}
}, 5000);

// ── ZOOM POR PINÇA NA FONTE (dois dedos na área de leitura) ────────────
(function(){
    var el = document.getElementById('bible-text');
    var startDist = 0, startSize = 16, pinching = false;

    function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
    function aplicar(px){
        px = Math.round(Math.max(11, Math.min(28, px)));
        if(px !== state.fontSize){
            state.fontSize = px;
            document.getElementById('bible-text').style.fontSize = px + 'px';
        }
    }

    el.addEventListener('touchstart', function(e){
        if(e.touches.length === 2){
            pinching = true;
            startDist = dist(e.touches);
            startSize = state.fontSize;
            e.preventDefault();
        }
    }, {passive:false});

    el.addEventListener('touchmove', function(e){
        if(!pinching || e.touches.length !== 2) return;
        e.preventDefault();
        aplicar(startSize * dist(e.touches) / startDist);
    }, {passive:false});

    el.addEventListener('touchend', function(e){
        if(e.touches.length < 2 && pinching){
            pinching = false;
            saveState();
        }
    }, {passive:true});
})();

// ============================================================
// NAVEGAÇÃO POR GESTOS (swipe) + HISTÓRICO DO ANDROID
// Swipe esquerda → próximo capítulo
// Swipe direita → capítulo anterior
// Cada navegação empilha no history.pushState, pra o botão
// voltar do Android desfazer na mesma ordem.
// ============================================================
(function(){
    var el = document.getElementById('bible-text');
    var inicioX = 0, inicioY = 0, inicioTempo = 0, comDoisDedos = false, bloqueandoGestoNativo = false;

    var DISTANCIA_MINIMA = 70;
    var TEMPO_MAXIMO = 900;
    var PROPORCAO_MINIMA = 1.8;
    var LIMIAR_INTENCAO = 12;

    el.addEventListener('touchstart', function(e){
        if(e.touches.length === 1){
            inicioX = e.touches[0].clientX;
            inicioY = e.touches[0].clientY;
            inicioTempo = Date.now();
            comDoisDedos = false;
            bloqueandoGestoNativo = false;
        } else {
            comDoisDedos = true;
        }
    }, {passive:true});

    el.addEventListener('touchmove', function(e){
        if(comDoisDedos || e.touches.length !== 1) return;
        var dx = e.touches[0].clientX - inicioX;
        var dy = e.touches[0].clientY - inicioY;
        if(!bloqueandoGestoNativo && Math.abs(dx) > LIMIAR_INTENCAO && Math.abs(dx) > Math.abs(dy)){
            bloqueandoGestoNativo = true;
        }
        if(bloqueandoGestoNativo && e.cancelable){
            e.preventDefault();
        }
    }, {passive:false});

    el.addEventListener('touchend', function(e){
        if(comDoisDedos || e.touches.length !== 0 || e.changedTouches.length !== 1) return;
        var dx = e.changedTouches[0].clientX - inicioX;
        var dy = e.changedTouches[0].clientY - inicioY;
        var dt = Date.now() - inicioTempo;
        if(dt > TEMPO_MAXIMO) return;
        if(Math.abs(dx) < DISTANCIA_MINIMA) return;
        if(Math.abs(dx) < Math.abs(dy) * PROPORCAO_MINIMA) return;

        if(dx < 0) _navegarCapitulo(1);   // swipe esquerda → próximo
        else _navegarCapitulo(-1);         // swipe direita → anterior
    }, {passive:true});
})();

function _navegarCapitulo(dir) {
    var book = bibleData[state.bookIndex];
    if (!book) return;
    var totalCaps = book.chapters.length;

    if (dir > 0) {
        // Próximo capítulo (ou próximo livro)
        if (state.chapterIndex < totalCaps - 1) {
            state.chapterIndex++;
        } else if (state.bookIndex < bibleData.length - 1) {
            state.bookIndex++;
            state.chapterIndex = 0;
        } else {
            return; // fim da Bíblia
        }
    } else {
        // Capítulo anterior (ou livro anterior)
        if (state.chapterIndex > 0) {
            state.chapterIndex--;
        } else if (state.bookIndex > 0) {
            state.bookIndex--;
            state.chapterIndex = bibleData[state.bookIndex].chapters.length - 1;
        } else {
            return; // início da Bíblia
        }
    }

    state.lastPosition = { livro: state.bookIndex, capitulo: state.chapterIndex, versiculo: 0 };
    renderBookList(); renderChapterList(); renderChapter(); saveState();

    // Empilha no histórico do navegador (botão voltar do Android)
    try {
        history.pushState({ bi: state.bookIndex, ci: state.chapterIndex }, '',
            location.pathname + location.search);
    } catch(e) {}
}

function abrirBusca() {
    const overlay = document.getElementById('search-overlay');
    overlay.style.display = 'flex';

}
function fecharBusca() {
    document.getElementById('search-overlay').style.display = 'none';

}

function performSearch() {
    const term = document.getElementById('search-input').value.trim().toLowerCase();
    if (!term) return;

    const container = document.getElementById('search-results');
    let results = [];
    bibleData.forEach((book, bi) => {
        book.chapters.forEach((chap, ci) => {
            chap.forEach((text, vi) => {
                if (text.toLowerCase().includes(term)) {
                    results.push({ book: book.name, bi, ci, vi, text });
                }
            });
        });
    });

    if (results.length === 0) {
        container.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:30px;">Nenhum resultado para "${term}".</div>`;
        return;
    }

    let html = `<div style="font-size:12px;color:var(--text-muted);padding:0 0 10px;">${results.length} resultado${results.length!==1?'s':''} encontrado${results.length!==1?'s':''}</div>`;
    results.forEach(r => {
        const highlight = r.text.replace(new RegExp(`(${term})`, 'gi'), '<mark style="background:#fdf6d9;color:#111;">$1</mark>');
        html += `<div style="padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;" data-bi="${r.bi}" data-ci="${r.ci}" data-vi="${r.vi}">
            <div style="font-weight:600;font-size:12px;color:var(--accent-gold);margin-bottom:3px;">${r.book} ${r.ci+1}:${r.vi+1}</div>
            <div style="font-size:15px;line-height:1.5;">${highlight}</div>
        </div>`;
    });
    container.innerHTML = html;
    container.querySelectorAll('[data-bi]').forEach(el => {
        el.addEventListener('click', () => {
            state.bookIndex = parseInt(el.dataset.bi);
            state.chapterIndex = parseInt(el.dataset.ci);
            renderBookList(); renderChapterList(); renderChapter();
            fecharBusca();
            setTimeout(() => {
                const target = document.querySelector(`.verse[data-verse="${el.dataset.vi}"]`);
                if (target && target.scrollIntoView) target.scrollIntoView({ block: 'center' });
            }, 150);
        });
    });
}

            state.lastPosition = {
                livro: state.bookIndex,
                capitulo: state.chapterIndex,
                versiculo: idx
            };
            saveState();
        }
        // Marcar capítulo como lido se rolou até o final
        if (container.scrollTop + container.clientHeight >= container.scrollHeight - 30) {
            state.chaptersRead.add(`${state.bookIndex}|${state.chapterIndex}`);
            renderChapterList();
            saveState();
        }
    }, 500);
});

async function init() {
    loadState();
    applyTheme();
    document.getElementById('bible-text').style.fontSize = state.fontSize + 'px';

    // Carrega dados da JFA imediatamente (já está no head como defer)
    const loaded = await loadBibleData();
    if (!loaded) {
        toast('⚠️ Usando dados de emergência.');
    }

    // Restaura posição
    if (state.lastPosition) {
        const lp = state.lastPosition;
        if (lp.livro !== undefined) state.bookIndex = lp.livro;
        if (lp.capitulo !== undefined) state.chapterIndex = lp.capitulo;
    }

    renderBookList();
    renderChapterList();
    renderChapter();

    // Rola até o versículo exato onde parou
    if (state.lastPosition && state.lastPosition.versiculo !== undefined && state.lastPosition.versiculo > 0) {
        const vi = state.lastPosition.versiculo;
        setTimeout(() => {
            const target = document.querySelector(`.verse[data-verse="${vi}"]`);
            if (target && target.scrollIntoView) target.scrollIntoView({ block: 'start', behavior: 'instant' });
        }, 120);
    }

    // Fechar menu ao clicar fora
    document.addEventListener('click', (e) => {
        const menu = document.getElementById('verse-menu');
        if (menu.classList.contains('open') && !menu.contains(e.target) && !e.target.closest('.verse')) {
            hideVerseMenu();
        }
    });

    console.log('✅ Bíblia Digital Qq carregada!');

    // ── SELETOR DE VERSÕES (carrega em background, sem bloquear a leitura) ──
    if (typeof BibleVersionsSimple !== 'undefined') {
        // Listener de troca (registra antes de iniciar)
        window.addEventListener('bible-version-changed', (e) => {
            bibleData = window.bibleDataExterno;
            renderBookList();
            renderChapterList();
            renderChapter(true);
        });

        // Inicializa em background — app já está funcionando
        BibleVersionsSimple.init(['JFA', 'KJF', 'NTLH', 'NVI'], 'JFA').then(() => {
            const vc = document.getElementById('bible-version-container');
            const tgt = document.getElementById('version-btn-container');
            if (vc && tgt) tgt.appendChild(vc);
        });
    }
}

// Inicia quando o DOM estiver pronto
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

</script>
</body>
</html>
