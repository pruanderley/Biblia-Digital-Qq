<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bíblia Digital Qq</title>
  <style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0d0d0d;
      --bg-card: #1a1a1a;
      --bg-panel: #141414;
      --accent-gold: #ffffff;
      --accent-warm: #cccccc;
      --accent-red: #555555;
      --text-primary: #f5f5f5;
      --text-secondary: #cccccc;
      --text-muted: #888888;
      --text-on-gold: #000000;
      --border: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; }

    /* Layout Principal */
    .app-container { display: flex; width: 100%; height: 100vh; }
    
    /* Painel Lateral */
    .sidebar { width: 300px; background-color: var(--bg-secondary); padding: 15px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--border); }
    .title { font-family: 'Georgia', serif; font-size: 22px; font-weight: bold; color: var(--accent-gold); text-align: center; }
    .subtitle { font-size: 12px; color: var(--text-secondary); text-align: center; }
    .status { font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 5px; }

    .scroll-box { background-color: var(--bg-panel); border-radius: 6px; padding: 6px; overflow-y: auto; border: 1px solid var(--border); }
    .livros-box { height: 170px; display: flex; flex-direction: column; gap: 2px; }
    .capitulos-box { height: 140px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-content: start; }

    .btn { background-color: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: left; width: 100%; }
    .btn:hover { background-color: var(--border); }
    .btn-gold { background-color: var(--accent-gold); color: var(--text-on-gold); font-weight: bold; }
    .btn-gold:hover { background-color: var(--accent-warm); }
    .btn-cap { text-align: center; padding: 6px; }

    /* Painel Central */
    .main-content { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 10px; background-color: var(--bg-primary); }
    .top-bar { display: flex; gap: 10px; }
    .search-input { flex: 1; background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 14px; border-radius: 6px; outline: none; }
    .text-area { flex: 1; background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 20px; overflow-y: auto; font-family: 'Georgia', serif; font-size: 18px; line-height: 1.6; }

    .titulo-capitulo { color: var(--accent-gold); font-size: 20px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .versiculo { margin-bottom: 12px; cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: background 0.2s; }
    .versiculo:hover { background-color: rgba(255,255,255,0.05); }

    /* Modal / Pop-up */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal { background-color: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; width: 420px; max-width: 90%; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .color-picker { display: flex; gap: 6px; justify-content: center; margin: 8px 0; }
    .color-btn { width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; font-weight: bold; font-size: 10px; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="title">Bíblia Digital Qq</div>
      <div class="subtitle">Navegação</div>
      <div class="status" id="status-label">Carregando dados...</div>

      <label style="font-size: 12px; color: var(--text-secondary);">Livro:</label>
      <div class="scroll-box livros-box" id="lista-livros"></div>

      <label style="font-size: 12px; color: var(--text-secondary);">Capítulo:</label>
      <div class="scroll-box capitulos-box" id="lista-capitulos"></div>

      <button class="btn btn-gold" onclick="abrirFavoritos()">★ Favoritos</button>
      <button class="btn" onclick="abrirHistorico()">🕑 Histórico</button>
    </div>

    <!-- Main Area -->
    <div class="main-content">
      <div class="top-bar">
        <input type="text" id="entry-busca" class="search-input" placeholder="Pesquise por palavra-chave..." onkeydown="if(event.key==='Enter') pesquisar()">
        <button class="btn btn-gold" style="width: auto;" onclick="pesquisar()">Pesquisar</button>
        <button class="btn" style="width: auto;" onclick="alternarAudioCapitulo()">🔊 Ouvir Capítulo</button>
      </div>

      <div class="text-area" id="texto-biblia"></div>
    </div>
  </div>

  <!-- Modal do Versículo -->
  <div class="modal-overlay" id="modal-versiculo">
    <div class="modal">
      <div id="modal-titulo" class="title" style="font-size: 18px;"></div>
      <div id="modal-texto" style="text-align: center; font-size: 15px; margin-bottom: 10px;"></div>

      <label style="font-size: 12px; text-align: center; color: var(--text-secondary);">Destacar com cor:</label>
      <div class="color-picker" id="color-picker"></div>
      <button class="btn" onclick="aplicarDestaque(null)">✕ Remover destaque</button>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 5px 0;">

      <button class="btn btn-gold" id="btn-modal-fav" onclick="alternarFavoritoAtual()">☆ Adicionar aos Favoritos</button>
      <button class="btn" onclick="abrirAnotacao()">📝 Anotação</button>
      <button class="btn" onclick="copiarVersiculo()">📋 Copiar versículo</button>
      <button class="btn" onclick="compartilharWhatsApp()">📤 Compartilhar (WhatsApp)</button>
      <button class="btn" onclick="ouvirVersiculoAtual()">🔊 Ouvir versículo</button>
      <button class="btn" onclick="pesquisarGoogleIA()">🔎 Pesquisar com Google IA (Gemini)</button>
      <button class="btn" style="background-color: var(--accent-red); color: white;" onclick="fecharModal()">Fechar</button>
    </div>
  </div>

  <!-- Carrega a base de dados em JS externa se existir -->
  <script src="Biblia_data.js"></script>
  <script src="biblia_data.js"></script>

  <script>
    // Dados de Emergência caso Biblia_data.js não seja carregado
    const DADOS_EMERGENCIA = [
      {livro: "Gênesis", capitulo: "1", versiculo: "1", texto: "No princípio, criou Deus os céus e a terra."},
      {livro: "João", capitulo: "3", versiculo: "16", texto: "Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna."},
      {livro: "Salmos", capitulo: "23", versiculo: "1", texto: "O Senhor é o meu pastor; nada me faltará."}
    ];

    const CORES_DESTAQUE = [
      ["Amarelo", "#fdf6d9"], ["Vermelho", "#fcdfdf"], ["Verde", "#dbf4e4"],
      ["Azul", "#e1effd"], ["Laranja", "#fdecd9"], ["Rosa", "#fce2ee"],
      ["Roxo", "#efe2f7"], ["Turquesa", "#d9f4f2"]
    ];

    // Estado da Aplicação
    let dadosBiblia = [];
    let livros = [];
    let livroAtual = null;
    let capituloAtual = null;
    let versiculoSelecionado = null;

    // Dados de usuário salvos no navegador (localStorage)
    let userStorage = JSON.parse(localStorage.getItem('biblia_dados_usuario')) || {
      destaques: {}, favoritos: {}, anotacoes: {}, historico: [], ultima_posicao: null
    };

    function salvarDadosUsuario() {
      localStorage.setItem('biblia_dados_usuario', JSON.stringify(userStorage));
    }

    // Inicialização
    window.onload = function() {
      carregarDados();
      renderColorPicker();
    };

    function carregarDados() {
      if (typeof bibleDataExterno !== 'undefined') {
        processarDadosJS(bibleDataExterno);
      } else if (typeof bibleData !== 'undefined') {
        processarDadosJS(bibleData);
      } else {
        dadosBiblia = DADOS_EMERGENCIA;
        livros = [...new Set(dadosBiblia.map(v => v.livro))];
        document.getElementById('status-label').innerText = "⚡ Dados de emergência ativados";
      }

      construirListaLivros();

      let initLivro = userStorage.ultima_posicao?.livro || livros[0];
      let initCap = userStorage.ultima_posicao?.capitulo || "1";
      if (initLivro) selecionarLivro(initLivro, initCap);
    }

    function processarDadosJS(data) {
      dadosBiblia = [];
      livros = [];
      data.forEach((l, i) => {
        let nome = l.name || `Livro ${i+1}`;
        livros.push(nome);
        (l.chapters || []).forEach((c, ci) => {
          c.forEach((v, vi) => {
            if (v && v.trim()) {
              dadosBiblia.push({ livro: nome, capitulo: String(ci+1), versiculo: String(vi+1), texto: v.trim() });
            }
          });
        });
      });
      document.getElementById('status-label').innerText = `✅ ${dadosBiblia.length} versículos carregados`;
    }

    function construirListaLivros() {
      const container = document.getElementById('lista-livros');
      container.innerHTML = '';
      livros.forEach(l => {
        const btn = document.createElement('button');
        btn.className = `btn ${l === livroAtual ? 'btn-gold' : ''}`;
        btn.innerText = l;
        btn.onclick = () => selecionarLivro(l);
        container.appendChild(btn);
      });
    }

    function selecionarLivro(livro, capituloInicial = "1") {
      livroAtual = livro;
      construirListaLivros();

      const caps = [...new Set(dadosBiblia.filter(v => v.livro === livro).map(v => parseInt(v.capitulo)))].sort((a,b)=>a-b);
      const container = document.getElementById('lista-capitulos');
      container.innerHTML = '';

      caps.forEach(c => {
        const cs = String(c);
        const btn = document.createElement('button');
        btn.className = `btn btn-cap ${cs === capituloAtual ? 'btn-gold' : ''}`;
        btn.innerText = cs;
        btn.onclick = () => selecionarCapitulo(cs);
        container.appendChild(btn);
      });

      selecionarCapitulo(capituloInicial);
    }

    function selecionarCapitulo(capitulo) {
      capituloAtual = capitulo;
      userStorage.ultima_posicao = { livro: livroAtual, capitulo: capituloAtual };
      salvarDadosUsuario();

      // Atualiza interface do capítulo
      Array.from(document.getElementById('lista-capitulos').children).forEach(btn => {
        btn.className = `btn btn-cap ${btn.innerText === capituloAtual ? 'btn-gold' : ''}`;
      });

      mostrarTexto();
    }

    function mostrarTexto() {
      const container = document.getElementById('texto-biblia');
      container.innerHTML = `<div class="titulo-capitulo">--- ${livroAtual.toUpperCase()} - CAPÍTULO ${capituloAtual} ---</div>`;

      const versos = dadosBiblia.filter(v => v.livro === livroAtual && v.capitulo === capituloAtual);
      
      versos.forEach(v => {
        const chave = `${v.livro}|${v.capitulo}|${v.versiculo}`;
        const div = document.createElement('div');
        div.className = 'versiculo';
        
        let favMark = userStorage.favoritos[chave] ? '★ ' : '';
        let noteMark = userStorage.anotacoes[chave] ? '📝 ' : '';
        div.innerText = `${favMark}${noteMark}${v.versiculo}. ${v.texto}`;

        let cor = userStorage.destaques[chave];
        if (cor) {
          div.style.backgroundColor = cor;
          div.style.color = "#000000";
        }

        div.onclick = () => abrirMenuVersiculo(v, chave);
        container.appendChild(div);
      });
    }

    // Modal e Ações
    function renderColorPicker() {
      const cp = document.getElementById('color-picker');
      CORES_DESTAQUE.forEach(([nome, cor]) => {
        const btn = document.createElement('button');
        btn.className = 'color-btn';
        btn.style.backgroundColor = cor;
        btn.innerText = nome[0];
        btn.onclick = () => aplicarDestaque(cor);
        cp.appendChild(btn);
      });
    }

    function abrirMenuVersiculo(v, chave) {
      versiculoSelecionado = { ...v, chave };
      document.getElementById('modal-titulo').innerText = `${v.livro} ${v.capitulo}:${v.versiculo}`;
      document.getElementById('modal-texto').innerText = `"${v.texto}"`;

      const ehFav = userStorage.favoritos[chave];
      document.getElementById('btn-modal-fav').innerText = ehFav ? "★ Remover dos Favoritos" : "☆ Adicionar aos Favoritos";

      document.getElementById('modal-versiculo').style.display = 'flex';
    }

    function fecharModal() { document.getElementById('modal-versiculo').style.display = 'none'; }

    function aplicarDestaque(cor) {
      if (!cor) delete userStorage.destaques[versiculoSelecionado.chave];
      else userStorage.destaques[versiculoSelecionado.chave] = cor;
      salvarDadosUsuario();
      fecharModal();
      mostrarTexto();
    }

    function alternarFavoritoAtual() {
      const k = versiculoSelecionado.chave;
      if (userStorage.favoritos[k]) delete userStorage.favoritos[k];
      else userStorage.favoritos[k] = true;
      salvarDadosUsuario();
      fecharModal();
      mostrarTexto();
    }

    function abrirAnotacao() {
      const nota = prompt("Sua anotação para este versículo:", userStorage.anotacoes[versiculoSelecionado.chave] || "");
      if (nota !== null) {
        if (nota.trim()) userStorage.anotacoes[versiculoSelecionado.chave] = nota.trim();
        else delete userStorage.anotacoes[versiculoSelecionado.chave];
        salvarDadosUsuario();
        fecharModal();
        mostrarTexto();
      }
    }

    function copiarVersiculo() {
      const v = versiculoSelecionado;
      navigator.clipboard.writeText(`${v.livro} ${v.capitulo}:${v.versiculo} - ${v.texto}`);
      alert("Versículo copiado!");
    }

    function compartilharWhatsApp() {
      const v = versiculoSelecionado;
      const text = encodeURIComponent(`${v.livro} ${v.capitulo}:${v.versiculo} - "${v.texto}"`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    function pesquisarGoogleIA() {
      const v = versiculoSelecionado;
      const query = encodeURIComponent(`${v.livro} ${v.capitulo}:${v.versiculo} ${v.texto}`);
      window.open(`https://www.google.com/search?q=${query}&udm=50`, '_blank');
    }

    // Voz / TTS Nativo
    function ouvirVersiculoAtual() {
      const msg = new SpeechSynthesisUtterance(versiculoSelecionado.texto);
      msg.lang = 'pt-BR';
      window.speechSynthesis.speak(msg);
    }

    function alternarAudioCapitulo() {
      window.speechSynthesis.cancel();
      const versos = dadosBiblia.filter(v => v.livro === livroAtual && v.capitulo === capituloAtual);
      const textoCompleto = versos.map(v => `${v.versiculo}. ${v.texto}`).join(' ');
      const msg = new SpeechSynthesisUtterance(textoCompleto);
      msg.lang = 'pt-BR';
      window.speechSynthesis.speak(msg);
    }

    // Pesquisa Geral
    function pesquisar() {
      const termo = document.getElementById('entry-busca').value.toLowerCase();
      if (!termo) return;

      const container = document.getElementById('texto-biblia');
      container.innerHTML = `<div class="titulo-capitulo">--- RESULTADOS DA BUSCA POR: '${termo}' ---</div>`;

      let cont = 0;
      dadosBiblia.forEach(v => {
        if (v.texto.toLowerCase().includes(termo)) {
          const div = document.createElement('div');
          div.className = 'versiculo';
          div.innerText = `${v.livro} ${v.capitulo}:${v.versiculo} - ${v.texto}`;
          div.onclick = () => { selecionarLivro(v.livro, v.capitulo); };
          container.appendChild(div);
          cont++;
        }
      });

      if (cont === 0) container.innerHTML += '<div>Nenhum versículo encontrado.</div>';
    }

    function abrirFavoritos() {
      const container = document.getElementById('texto-biblia');
      container.innerHTML = `<div class="titulo-capitulo">--- VERSÍCULOS FAVORITOS ---</div>`;
      Object.keys(userStorage.favoritos).forEach(chave => {
        const [l, c, v] = chave.split('|');
        const item = dadosBiblia.find(db => db.livro === l && db.capitulo === c && db.versiculo === v);
        if (item) {
          const div = document.createElement('div');
          div.className = 'versiculo';
          div.innerText = `★ ${item.livro} ${item.capitulo}:${item.versiculo} - ${item.texto}`;
          div.onclick = () => selecionarLivro(item.livro, item.capitulo);
          container.appendChild(div);
        }
      });
    }
  </script>
</body>
</html>
