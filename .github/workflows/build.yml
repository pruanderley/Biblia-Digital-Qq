name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp -r *.html *.js *.json *.png *.css www/ 2>/dev/null || true
          cp -r icons www/icons 2>/dev/null || true
          cp -r assets www/assets 2>/dev/null || true
          ls -la www/

      - name: Remove android folder if exists
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Copy Java patches
        run: |
          mkdir -p android/app/src/main/java/biblia/digital/qq/
          cp patches/MainActivity.java android/app/src/main/java/biblia/digital/qq/
          cp patches/AudioForegroundService.java android/app/src/main/java/biblia/digital/qq/

      - name: Patch AndroidManifest for foreground service
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Adiciona permissão de FOREGROUND_SERVICE
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>|' "$MANIFEST"
          # Adiciona o service dentro da tag <application>
          sed -i 's|</application>|        <service android:name=".AudioForegroundService" android:foregroundServiceType="mediaPlayback" android:exported="false" />\n    </application>|' "$MANIFEST"
          echo "AndroidManifest patched"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: biblia-digital-qq
          path: android/app/build/outputs/apk/debug/app-debug.apk
